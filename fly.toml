# fly.toml file generated for spookybot on 2023-01-05T15:04:22-08:00

app = "spookybot"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

# Fly preserves `fly scale count 1` across normal deploys.
# Exact machine count is not stored in `fly.toml`; if this app is ever scaled to
# zero Machines, redeploy with `fly deploy --ha=false` to avoid Fly seeding two.
[deploy]
  strategy = "rolling"
  max_unavailable = 1

[env]
  ALLOW_EOL_SHIMMED_BUILDER = "1"
  PORT = "3000"

[experimental]
  allowed_public_ports = []
  auto_rollback = true
  private_network = true

[build]
  builder = "heroku/builder:24"

[build.args]
  ALLOW_EOL_SHIMMED_BUILDER = "1"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  processes = ["app"]

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"
